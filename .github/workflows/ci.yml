name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          pip install --upgrade pip wheel uv
          uv pip install --system -r pyproject.toml --extra=dev

      - name: Run ruff
        run: ruff check main/ config/ tests/ --select E,W,F --ignore E501

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEVDB_URL: sqlite:///test_db.sqlite3
      SUBMIT_LOG: "False"
      ALLOWED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip wheel uv
          # prod too: some tests load config.settings.pro, which installs the gunicorn app.
          uv pip install --system -r pyproject.toml --extra=dev --extra=prod

      - name: Copy sample env
        run: cp sample.env .env

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        run: pytest tests/ -v --tb=short

  integration:
    name: Integration (live Jasmin gateway)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEVDB_URL: sqlite:///test_db.sqlite3
      JASMIN_INTEGRATION: "1"
      TELNET_HOST: 127.0.0.1
      TELNET_PORT: "18990"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends telnet
          pip install --upgrade pip wheel uv
          uv pip install --system -r pyproject.toml --extra=dev

      - name: Start Jasmin, Redis and RabbitMQ
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

      - name: Gateway logs
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs jasmin

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the documentation (warnings are errors)
        run: |
          pip install uv
          uv pip install --system -r pyproject.toml --extra=docs
          mkdocs build --strict

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/docker/slim/Dockerfile
          push: false
          tags: jasmin-web-panel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
