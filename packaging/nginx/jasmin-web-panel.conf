# Nginx reverse proxy template for Jasmin Web Panel
# Replace __SERVER_NAME__ (e.g. sms.example.com) and __INSTALL_DIR__ (/opt/jasmin-web-panel)

upstream jasmin_web_panel {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name __SERVER_NAME__;
    charset utf-8;
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/jasmin_web_access.log combined;
    error_log  /var/log/nginx/jasmin_web_error.log;

    location /static/ {
        alias __INSTALL_DIR__/public/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias __INSTALL_DIR__/public/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://jasmin_web_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
