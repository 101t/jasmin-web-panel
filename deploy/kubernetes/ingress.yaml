apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jasmin-web
  namespace: jasmin-web
  annotations:
    # Works with ingress-nginx + cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sms.example.com
      secretName: jasmin-web-tls
  rules:
    - host: sms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jasmin-web
                port:
                  number: 80
