apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasmin-web
  namespace: jasmin-web
  labels:
    app: jasmin-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jasmin-web
  template:
    metadata:
      labels:
        app: jasmin-web
    spec:
      # Run migrations cleanly before Gunicorn starts (avoids multi-worker startup races)
      initContainers:
        - name: migrate
          image: tarekaec/jasmin_web_panel:3.2.0
          command: ["/app/env/bin/python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: jasmin-web-config
            - secretRef:
                name: jasmin-web-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: tarekaec/jasmin_web_panel:3.2.0
          command:
            - /bin/bash
            - -c
            - |
              /app/env/bin/python manage.py collectstatic --noinput --clear && \
              exec /app/env/bin/gunicorn config.wsgi:application \
                --workers "${APP_WORKERS:-4}" \
                --bind :8000 \
                --timeout 120 \
                --log-level info \
                --access-logfile - \
                --error-logfile -
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: jasmin-web-config
            - secretRef:
                name: jasmin-web-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/health_check
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health_check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
