apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Usage:
#   cp deploy/kubernetes/secret.yaml.example deploy/kubernetes/secret.yaml
#   # edit secret.yaml with strong SECRET_KEY, PRODB_URL, TELNET_PW
#   kubectl apply -f deploy/kubernetes/secret.yaml
#   kubectl apply -k deploy/kubernetes

namespace: jasmin-web

resources:
  - configmap.yaml
  - web-deployment.yaml
  - celery-deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: jasmin-web-panel
